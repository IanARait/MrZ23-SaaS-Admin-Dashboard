<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset password · FlowBoard</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" href="../css/variables.css"/>
  <link rel="stylesheet" href="../css/reset.css"/>
  <link rel="stylesheet" href="../css/global.css"/>
  <link rel="stylesheet" href="../css/components.css"/>
  <link rel="stylesheet" href="../css/forms.css"/>
  <link rel="stylesheet" href="../css/animations.css"/>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card" style="max-width:400px">
      <div id="requestStep">
        <div class="auth-brand" style="margin-bottom:var(--sp-5)">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><rect width="24" height="24" rx="6" fill="var(--accent)"/><path d="M7 8h10M7 12h6M7 16h8" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
          <span class="brand-text">FlowBoard</span>
        </div>
        <h1 class="auth-title">Forgot password?</h1>
        <p class="auth-subtitle">Enter your email and we'll send a reset link.</p>
        <form id="forgotForm" class="auth-form" novalidate>
          <div class="field">
            <label class="field-label" for="email">Email</label>
            <input type="email" id="email" placeholder="you@company.com" autocomplete="email"/>
            <div class="field-error"></div>
          </div>
          <button class="btn btn-primary btn-lg" type="submit" style="width:100%">Send reset link</button>
        </form>
        <p class="auth-footer"><a href="login.html"><i class="fa-solid fa-arrow-left"></i> Back to sign in</a></p>
      </div>

      <div id="sentStep" hidden style="text-align:center">
        <div style="width:48px;height:48px;border-radius:var(--radius);background:var(--success-bg);color:var(--success);display:flex;align-items:center;justify-content:center;margin:0 auto var(--sp-4);font-size:var(--fs-xl)">
          <i class="fa-solid fa-paper-plane"></i>
        </div>
        <h1 class="auth-title">Check your inbox</h1>
        <p class="auth-subtitle" style="margin-bottom:var(--sp-5)">We've sent a reset link to <b id="sentTo" style="color:var(--text)"></b>. Expires in 30 min.</p>
        <button class="btn btn-secondary btn-lg" style="width:100%" onclick="document.getElementById('sentStep').hidden=true;document.getElementById('requestStep').hidden=false;">Use different email</button>
      </div>

      <p style="text-align:center;margin-top:var(--sp-4);font-size:var(--fs-xs);color:var(--muted)">Demo only — no real email is sent.</p>
    </div>
  </div>

  <script src="../js/theme.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    document.getElementById("forgotForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("email");
      FB.validate.clearError(e.target);
      if (!FB.validate.email(email.value)) { FB.validate.setError(email, "Enter a valid email address."); return; }
      document.getElementById("sentTo").textContent = email.value.trim();
      document.getElementById("requestStep").hidden = true;
      document.getElementById("sentStep").hidden = false;
    });
  </script>
</body>
</html>
