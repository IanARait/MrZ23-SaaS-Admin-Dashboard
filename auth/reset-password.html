<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Set new password · FlowBoard</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" href="../css/variables.css"/>
  <link rel="stylesheet" href="../css/reset.css"/>
  <link rel="stylesheet" href="../css/global.css"/>
  <link rel="stylesheet" href="../css/components.css"/>
  <link rel="stylesheet" href="../css/forms.css"/>
  <link rel="stylesheet" href="../css/animations.css"/>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card" style="max-width:400px">
      <div id="formStep">
        <div class="auth-brand" style="margin-bottom:var(--sp-5)">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><rect width="24" height="24" rx="6" fill="var(--accent)"/><path d="M7 8h10M7 12h6M7 16h8" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
          <span class="brand-text">FlowBoard</span>
        </div>
        <h1 class="auth-title">Set new password</h1>
        <p class="auth-subtitle">Choose a strong password you haven't used before.</p>
        <form id="resetForm" class="auth-form" novalidate>
          <div class="field">
            <label class="field-label" for="password">New password *</label>
            <div style="position:relative">
              <input type="password" id="password" placeholder="8+ characters" autocomplete="new-password"/>
              <button type="button" data-pw-toggle aria-label="Show password" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:var(--fs-xs)">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
            <div class="field-error"></div>
          </div>
          <div class="field">
            <label class="field-label" for="confirm">Confirm password *</label>
            <input type="password" id="confirm" placeholder="Repeat password" autocomplete="new-password"/>
            <div class="field-error"></div>
          </div>
          <button class="btn btn-primary btn-lg" type="submit" style="width:100%">Reset password</button>
        </form>
        <p class="auth-footer"><a href="login.html"><i class="fa-solid fa-arrow-left"></i> Back to sign in</a></p>
      </div>

      <div id="doneStep" hidden style="text-align:center">
        <div style="width:48px;height:48px;border-radius:var(--radius);background:var(--success-bg);color:var(--success);display:flex;align-items:center;justify-content:center;margin:0 auto var(--sp-4);font-size:var(--fs-xl)">
          <i class="fa-solid fa-check"></i>
        </div>
        <h1 class="auth-title">Password updated</h1>
        <p class="auth-subtitle" style="margin-bottom:var(--sp-5)">Your password has been changed successfully.</p>
        <a class="btn btn-primary btn-lg" href="login.html" style="width:100%">Continue to sign in</a>
      </div>
    </div>
  </div>

  <script src="../js/theme.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    document.getElementById("resetForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const pw = document.getElementById("password");
      const confirm = document.getElementById("confirm");
      FB.validate.clearError(e.target);
      let ok = true;
      if (pw.value.length < 8) { FB.validate.setError(pw, "Password must be at least 8 characters."); ok = false; }
      if (confirm.value !== pw.value) { FB.validate.setError(confirm, "Passwords don't match."); ok = false; }
      if (!ok) return;
      setTimeout(() => {
        document.getElementById("formStep").hidden = true;
        document.getElementById("doneStep").hidden = false;
        FB.toast.success("Password reset successfully");
      }, 500);
    });
  </script>
</body>
</html>
