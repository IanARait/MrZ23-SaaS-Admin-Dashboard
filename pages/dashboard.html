<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard · FlowBoard</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" href="../css/variables.css"/>
  <link rel="stylesheet" href="../css/reset.css"/>
  <link rel="stylesheet" href="../css/global.css"/>
  <link rel="stylesheet" href="../css/components.css"/>
  <link rel="stylesheet" href="../css/forms.css"/>
  <link rel="stylesheet" href="../css/dashboard.css"/>
  <link rel="stylesheet" href="../css/animations.css"/>
  <link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body>
  <div class="page-content">

    <!-- KPI strip -->
    <section class="kpi-strip" id="statCards" aria-label="Key metrics"></section>

    <!-- Charts row -->
    <section class="chart-grid">
      <div class="card">
        <div class="card-header">
          <div>
            <div class="card-title">Revenue overview</div>
            <div class="card-subtitle">Monthly recurring revenue</div>
          </div>
          <div class="tabs" role="tablist" style="border:none;margin:0">
            <button class="tab active" data-range="12">12M</button>
            <button class="tab" data-range="6">6M</button>
            <button class="tab" data-range="3">3M</button>
          </div>
        </div>
        <div class="card-body"><div class="chart-container" style="height:280px"><canvas id="revenueChart"></canvas></div></div>
      </div>

      <div class="card">
        <div class="card-header">
          <div>
            <div class="card-title">Sales by category</div>
            <div class="card-subtitle">Revenue share</div>
          </div>
        </div>
        <div class="card-body" style="display:grid;gap:16px;justify-items:center">
          <div class="chart-container" style="height:180px;max-width:200px"><canvas id="categoryChart"></canvas></div>
          <div id="categoryLegend" style="width:100%"></div>
        </div>
      </div>
    </section>

    <!-- Users + Activity -->
    <section class="content-grid">
      <div class="card">
        <div class="card-header">
          <div>
            <div class="card-title">User growth</div>
            <div class="card-subtitle">New sign-ups per month</div>
          </div>
        </div>
        <div class="card-body"><div class="chart-container" style="height:240px"><canvas id="usersChart"></canvas></div></div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">Recent activity</div>
          <a class="btn btn-ghost btn-sm" href="notifications.html">View all <i class="fa-solid fa-arrow-right"></i></a>
        </div>
        <div class="card-body" id="activityFeed"></div>
      </div>
    </section>

    <!-- Products + Schedule -->
    <section class="content-grid-wide">
      <div class="card">
        <div class="card-header">
          <div>
            <div class="card-title">Top products</div>
            <div class="card-subtitle">Best sellers this quarter</div>
          </div>
          <a class="btn btn-ghost btn-sm" href="products.html">All products</a>
        </div>
        <div class="card-body" id="topProducts"></div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">Upcoming schedule</div>
          <a class="btn btn-ghost btn-sm" href="calendar.html">Calendar</a>
        </div>
        <div class="card-body" id="upcomingSchedule"></div>
      </div>
    </section>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/charts.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/pages/dashboard.js"></script>
</body>
</html>
