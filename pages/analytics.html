<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Analytics Â· FlowBoard</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" href="../css/variables.css"/>
  <link rel="stylesheet" href="../css/reset.css"/>
  <link rel="stylesheet" href="../css/global.css"/>
  <link rel="stylesheet" href="../css/components.css"/>
  <link rel="stylesheet" href="../css/forms.css"/>
  <link rel="stylesheet" href="../css/tables.css"/>
  <link rel="stylesheet" href="../css/dashboard.css"/>
  <link rel="stylesheet" href="../css/responsive.css"/>
  <link rel="stylesheet" href="../css/animations.css"/>
</head>
<body>
  <div class="page-content">

    <div class="page-header" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--sp-3);margin-bottom:var(--density-gap)">
      <div>
        <h1 class="page-title">Analytics</h1>
        <p class="page-subtitle">Track your business performance and growth metrics</p>
      </div>
      <div class="segmented" role="tablist" id="dateRange">
        <button class="active" data-range="7">7D</button>
        <button data-range="30">30D</button>
        <button data-range="90">90D</button>
        <button data-range="365">1Y</button>
      </div>
    </div>

    <section class="stats-grid section-gap" id="analyticsStats"></section>

    <section class="grid-2 section-gap" style="grid-template-columns:1.7fr 1fr">
      <div class="card">
        <div class="card-head">
          <div><div class="card-title">Traffic Sources</div><div class="card-sub">Visitors by acquisition channel</div></div>
        </div>
        <div class="card-body"><div class="chart-wrap" style="height:280px"><canvas id="trafficChart"></canvas></div></div>
      </div>
      <div class="card">
        <div class="card-head">
          <div><div class="card-title">User Growth</div><div class="card-sub">New sign-ups per month</div></div>
        </div>
        <div class="card-body"><div class="chart-wrap" style="height:280px"><canvas id="userGrowthChart"></canvas></div></div>
      </div>
    </section>

    <section class="grid-2 section-gap" style="grid-template-columns:1.4fr 1fr">
      <div class="card">
        <div class="card-head">
          <div><div class="card-title">Revenue vs Expenses</div><div class="card-sub">Monthly comparison</div></div>
          <div class="segmented" role="tablist" id="revRange">
            <button class="active" data-range="12">12M</button>
            <button data-range="6">6M</button>
            <button data-range="3">3M</button>
          </div>
        </div>
        <div class="card-body"><div class="chart-wrap" style="height:280px"><canvas id="revExpChart"></canvas></div></div>
      </div>
      <div class="card">
        <div class="card-head"><div><div class="card-title">Sales by Category</div><div class="card-sub">Share of total revenue</div></div></div>
        <div class="card-body" style="display:grid;gap:20px;justify-items:center">
          <div class="chart-wrap" style="height:190px;max-width:210px"><canvas id="salesCatChart"></canvas></div>
          <div class="w-full" id="salesCatLegend"></div>
        </div>
      </div>
    </section>

    <section class="card section-gap">
      <div class="card-head"><div><div class="card-title">Conversion Funnel</div><div class="card-sub">From visit to subscription</div></div></div>
      <div class="card-body" id="funnelContainer"></div>
    </section>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/charts.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/pages/analytics.js"></script>
</body>
</html>
