<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>

  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<body>
  <div class="page-content">
    <div class="page-header">
      <div><div class="page-title">Reports</div><div class="page-subtitle">Generate and view detailed business reports</div></div>
    </div>
    <div class="grid-3" id="reportCards"></div>
    <div class="card" style="margin-top:var(--density-gap)">
      <div class="card-head">
        <div><div class="card-title" id="reportTitle">Revenue Report</div><div class="card-sub">Monthly breakdown</div></div>
        <button class="btn btn-outline btn-sm" id="exportReportBtn"><i class="fa-solid fa-download"></i> Export CSV</button>
      </div>
      <div class="card-body"><canvas id="reportChart" style="width:100%;max-height:320px"></canvas></div>
      <div class="card-body flush" id="reportTableWrap"></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/theme.js"></script>

  <script src="../js/charts.js"></script>

  <script src="../js/pages/reports.js"></script>
