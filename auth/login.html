<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign in · FlowBoard</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" href="../css/variables.css"/>
  <link rel="stylesheet" href="../css/reset.css"/>
  <link rel="stylesheet" href="../css/global.css"/>
  <link rel="stylesheet" href="../css/components.css"/>
  <link rel="stylesheet" href="../css/forms.css"/>
  <link rel="stylesheet" href="../css/animations.css"/>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card" style="max-width:400px">
      <div class="auth-brand">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="24" height="24" rx="6" fill="var(--accent)"/>
          <path d="M7 8h10M7 12h6M7 16h8" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="brand-text">FlowBoard</span>
      </div>

      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to your workspace</p>

      <form id="loginForm" class="auth-form" novalidate>
        <div class="field">
          <label class="field-label" for="email">Email</label>
          <input type="email" id="email" placeholder="you@company.com" autocomplete="email"/>
          <div class="field-error"></div>
        </div>
        <div class="field">
          <label class="field-label" for="password">Password</label>
          <div style="position:relative">
            <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password"/>
            <button type="button" data-pw-toggle aria-label="Show password" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:var(--fs-xs)">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
          <div class="field-error"></div>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between">
          <label class="check-field"><input type="checkbox" id="remember"/> <span>Remember me</span></label>
          <a href="forgot-password.html" style="font-size:var(--fs-sm);color:var(--accent);font-weight:500">Forgot password?</a>
        </div>

        <button class="btn btn-primary btn-lg" type="submit" style="width:100%">Sign in <i class="fa-solid fa-arrow-right"></i></button>
      </form>

      <div class="auth-divider">or</div>

      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-2)">
        <button class="btn btn-secondary" style="font-size:var(--fs-xs)"><i class="fa-brands fa-google" style="color:#DB4437"></i> Google</button>
        <button class="btn btn-secondary" style="font-size:var(--fs-xs)"><i class="fa-brands fa-github"></i> GitHub</button>
        <button class="btn btn-secondary" style="font-size:var(--fs-xs)"><i class="fa-brands fa-microsoft" style="color:#00A4EF"></i> MS</button>
      </div>

      <p class="auth-footer">
        No account? <a href="register.html">Create one free</a>
      </p>

      <div style="margin-top:var(--sp-4);padding:var(--sp-3);border:1px dashed var(--border);border-radius:var(--radius-sm);font-size:var(--fs-xs);color:var(--muted);line-height:1.5">
        <strong style="color:var(--text)">Demo</strong> — admin@flowboard.test / password. Runs locally, no data leaves your browser.
      </div>
    </div>
  </div>

  <script src="../js/theme.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    FB.authPage.guestOnly();
    document.getElementById("loginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const form = e.target;
      const email = document.getElementById("email");
      const pw = document.getElementById("password");
      FB.validate.clearError(form);
      let ok = true;
      if (!FB.validate.email(email.value)) { FB.validate.setError(email, "Enter a valid email address."); ok = false; }
      if (pw.value.length < 4) { FB.validate.setError(pw, "Password must be at least 4 characters."); ok = false; }
      if (!ok) return;

      const btn = form.querySelector("button[type=submit]");
      btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> Signing in…';
      btn.disabled = true;
      setTimeout(() => {
        if (email.value.trim().toLowerCase() === FB.authPage.demo.email && pw.value === FB.authPage.demo.password) {
          FB.authPage.signIn(email.value.trim().toLowerCase(), document.getElementById("remember").checked);
        } else {
          btn.innerHTML = 'Sign in <i class="fa-solid fa-arrow-right"></i>';
          btn.disabled = false;
          FB.validate.setError(pw, "Incorrect email or password.");
        }
      }, 650);
    });
    document.getElementById("email").value = "admin@flowboard.test";
    document.getElementById("password").value = "password";
  </script>
</body>
</html>
