<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Help Â· FlowBoard</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" href="../css/variables.css"/>
  <link rel="stylesheet" href="../css/reset.css"/>
  <link rel="stylesheet" href="../css/global.css"/>
  <link rel="stylesheet" href="../css/components.css"/>
  <link rel="stylesheet" href="../css/forms.css"/>
  <link rel="stylesheet" href="../css/responsive.css"/>
  <link rel="stylesheet" href="../css/animations.css"/>
</head>
<body>
  <div class="page-content">
    <div class="page-header" style="flex-direction:column;align-items:center;text-align:center">
      <div class="page-title">Help Center</div>
      <div class="page-subtitle" style="max-width:480px">Find answers to common questions and learn how to get the most out of FlowBoard.</div>
    </div>
    <div style="max-width:720px;margin:0 auto">
      <div class="input-wrap" style="margin-bottom:var(--density-gap)"><i class="fa-solid fa-magnifying-glass lead"></i><input class="input lg" id="helpSearch" placeholder="Search for helpâ€¦"/></div>
      <div class="section-gap" id="helpTopics"></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/charts.js"></script>
  <script src="../js/app.js"></script>
  <script>
  window.FB = window.FB || {};
  (() => {
    "use strict";
    const topics = [
      { icon: "fa-rocket", color: "var(--accent)", title: "Getting Started", desc: "Learn the basics of FlowBoard and set up your workspace.", articles: ["Creating your first project", "Inviting team members", "Setting up your profile"] },
      { icon: "fa-chart-line", color: "var(--success)", title: "Dashboard & Analytics", desc: "Understand your metrics and make data-driven decisions.", articles: ["Reading the dashboard", "Exporting reports", "Customizing views"] },
      { icon: "fa-users", color: "var(--info)", title: "Team Management", desc: "Manage users, roles, and permissions effectively.", articles: ["Adding team members", "Setting roles and permissions", "Managing departments"] },
      { icon: "fa-credit-card", color: "var(--warning)", title: "Billing & Invoices", desc: "Handle payments, subscriptions, and invoice management.", articles: ["Creating invoices", "Managing subscriptions", "Payment methods"] },
      { icon: "fa-list-check", color: "var(--secondary)", title: "Task Management", desc: "Organize work with Kanban boards and task tracking.", articles: ["Using the Kanban board", "Setting priorities", "Drag and drop tasks"] },
      { icon: "fa-shield-halved", color: "var(--danger)", title: "Security & Privacy", desc: "Keep your account secure with best practices.", articles: ["Enabling 2FA", "Managing sessions", "Password policies"] },
    ];

    function render(filter = "") {
      const el = document.getElementById("helpTopics");
      const q = filter.toLowerCase();
      const filtered = topics.filter((t) => !q || t.title.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q) || t.articles.some((a) => a.toLowerCase().includes(q)));
      el.innerHTML = filtered.map((t) => `<div class="card">
        <div class="card-body">
          <div style="display:flex;gap:var(--sp-4);align-items:start">
            <span class="stat-icon" style="background:${t.color}18;color:${t.color}"><i class="fa-solid ${t.icon}"></i></span>
            <div style="flex:1">
              <div style="font-weight:800;font-size:var(--fs-base);margin-bottom:4px">${t.title}</div>
              <div class="muted small" style="margin-bottom:var(--sp-3)">${t.desc}</div>
              <div style="display:grid;gap:6px">${t.articles.map((a) => `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--border)">
                <i class="fa-solid fa-file-lines muted" style="font-size:12px"></i><span class="small" style="cursor:pointer;font-weight:500">${a}</span>
              </div>`).join("")}</div>
            </div>
          </div>
        </div>
      </div>`).join("") || '<div class="empty-state"><span class="empty-icon"><i class="fa-solid fa-search"></i></span><div class="empty-title">No results</div><p class="empty-text">Try a different search term.</p></div>';
    }

    function init() {
      FB.app.ready({ active: "help", crumb: ["Help"], title: "Help" });
      render();
      document.getElementById("helpSearch").addEventListener("input", (e) => render(e.target.value));
    }
    document.addEventListener("DOMContentLoaded", init);
  })();
  </script>
</body>
</html>
