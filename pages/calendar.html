<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calendar Â· FlowBoard</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" href="../css/variables.css"/>
  <link rel="stylesheet" href="../css/reset.css"/>
  <link rel="stylesheet" href="../css/global.css"/>
  <link rel="stylesheet" href="../css/components.css"/>
  <link rel="stylesheet" href="../css/forms.css"/>
  <link rel="stylesheet" href="../css/dashboard.css"/>
  <link rel="stylesheet" href="../css/responsive.css"/>
  <link rel="stylesheet" href="../css/animations.css"/>
</head>
<body>
  <div class="page-content">
    <div class="page-header">
      <div><div class="page-title">Calendar</div><div class="page-subtitle">Schedule and manage your events</div></div>
      <div class="page-actions">
        <button class="btn btn-primary" id="addEventBtn"><i class="fa-solid fa-plus"></i> Add Event</button>
      </div>
    </div>
    <div class="card">
      <div class="card-head">
        <div style="display:flex;align-items:center;gap:var(--sp-3)">
          <button class="btn btn-ghost btn-sm" id="calPrev"><i class="fa-solid fa-chevron-left"></i></button>
          <div class="card-title" id="calTitle" style="min-width:180px;text-align:center"></div>
          <button class="btn btn-ghost btn-sm" id="calNext"><i class="fa-solid fa-chevron-right"></i></button>
          <button class="btn btn-outline btn-sm" id="calToday">Today</button>
        </div>
        <div class="segmented" role="tablist">
          <button class="active" data-view="month">Month</button>
          <button data-view="week">Week</button>
        </div>
      </div>
      <div class="card-body" id="calGrid"></div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/charts.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/pages/calendar.js"></script>
</body>
</html>
