<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 · FlowBoard</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" href="css/variables.css"/>
  <link rel="stylesheet" href="css/reset.css"/>
  <link rel="stylesheet" href="css/global.css"/>
  <link rel="stylesheet" href="css/components.css"/>
  <link rel="stylesheet" href="css/animations.css"/>
</head>
<body>
  <div style="display:grid;place-items:center;min-height:100vh;padding:var(--sp-6);text-align:center;background:var(--bg)">
    <div>
      <div style="font-size:72px;font-weight:800;letter-spacing:-0.04em;color:var(--accent);opacity:0.15;line-height:1">404</div>
      <h1 style="font-weight:700;font-size:var(--fs-xl);margin:var(--sp-3) 0 var(--sp-2);letter-spacing:-0.02em">Page not found</h1>
      <p style="color:var(--muted);font-size:var(--fs-sm);max-width:360px;margin:0 auto var(--sp-5)">The page you're looking for doesn't exist or has been moved.</p>
      <div style="display:flex;gap:var(--sp-2);justify-content:center">
        <a href="pages/dashboard.html" class="btn btn-primary"><i class="fa-solid fa-house"></i> Dashboard</a>
        <a href="pages/dashboard.html" class="btn btn-secondary"><i class="fa-solid fa-arrow-left"></i> Go home</a>
      </div>
    </div>
  </div>
</body>
</html>
